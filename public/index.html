<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Status Board</title>
<style>
  :root{
    --paper:#f5f5f7;
    --ink:#1d1d1f;
    --ink-soft:#6e6e73;
    --teal:#5e5ce6;
    --teal-dark:#4a48c4;
    --teal-bg: rgba(94,92,230,0.1);
    --amber:#ff9500;
    --amber-bg: rgba(255,149,0,0.12);
    --red:#ff3b30;
    --red-bg: rgba(255,59,48,0.12);
    --green:#34c759;
    --green-bg: rgba(52,199,89,0.12);
    --gray-bg: rgba(0,0,0,0.045);
    --card:#ffffff;
    --border: rgba(0,0,0,0.09);
    --overlay-bg: rgba(0,0,0,0.45);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 6px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08);
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#000000;
      --ink:#f5f5f7;
      --ink-soft:#98989d;
      --teal:#7d7aff;
      --teal-dark:#a5a3ff;
      --teal-bg: rgba(125,122,255,0.18);
      --amber:#ff9f0a;
      --amber-bg: rgba(255,159,10,0.16);
      --red:#ff453a;
      --red-bg: rgba(255,69,58,0.16);
      --green:#30d158;
      --green-bg: rgba(48,209,88,0.16);
      --gray-bg: rgba(255,255,255,0.07);
      --card:#1c1c1e;
      --border: rgba(255,255,255,0.12);
      --overlay-bg: rgba(0,0,0,0.65);
      --shadow-sm: 0 0 0 1px rgba(255,255,255,0.06);
      --shadow-md: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--paper); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; padding-bottom:60px; }
  .mono{ font-variant-numeric:tabular-nums; }
  header.top{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:24px 24px 16px; max-width:1400px; margin:0 auto; flex-wrap:wrap;
  }
  .brand-eyebrow{ font-size:13px; letter-spacing:.02em; color:var(--teal); font-weight:600; }
  .brand-title{ font-size:32px; font-weight:700; margin-top:2px; letter-spacing:-0.02em; }
  .header-actions{ display:flex; gap:10px; align-items:center; }
  .clock{ font-size:15px; color:var(--ink-soft); }
  main{ max-width:1400px; margin:0 auto; padding:0 24px; }

  button, a.btn{
    font-family:inherit; font-size:15px; font-weight:600; border:none; cursor:pointer;
    border-radius:var(--r-sm); padding:10px 16px; transition:transform .1s ease, opacity .15s ease;
    background:var(--card); color:var(--ink); border:1px solid var(--border);
  }
  button:active, a.btn:active{ transform:scale(0.97); }
  button:disabled{ opacity:.5; cursor:default; }
  button.primary, a.btn.primary{ background:var(--teal); color:#fff; border-color:transparent; }
  button.danger, a.btn.danger{ background:var(--red); color:#fff; border-color:transparent; }
  button.ghost, a.btn.ghost{ background:transparent; border-color:var(--border); }
  button.small, a.btn.small{ padding:6px 11px; font-size:13px; }
  button:focus-visible, a.btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .tabbar{ display:flex; gap:8px; margin-bottom:18px; }
  .tab{
    padding:9px 18px; border-radius:var(--r-pill); background:var(--card); border:1px solid var(--border);
    font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .tab.active{ background:var(--teal); color:#fff; border-color:transparent; }

  .chipbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .chip{
    padding:8px 16px; border-radius:var(--r-pill); background:var(--card); border:1px solid var(--border);
    font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .chip.active{ background:var(--teal); color:#fff; border-color:transparent; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;
  }
  .station{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm); padding:18px; display:flex; flex-direction:column; gap:12px;
  }
  .station-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .station-name{ font-size:19px; font-weight:700; letter-spacing:-0.01em; }
  .zone-tag{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-top:2px; }
  .station-count{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .task-list{ display:flex; flex-direction:column; gap:10px; }
  .task-row{
    border:1px solid var(--border); border-radius:var(--r-md); padding:14px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; gap:6px;
  }
  .task-row.status-in-progress{ box-shadow:0 0 0 2px var(--green); }
  .task-row.status-review{ box-shadow:0 0 0 2px var(--amber); }
  .task-row.status-blocked{ box-shadow:0 0 0 2px var(--red); }
  .task-row.help-flag{ animation:pulse-border 1.1s ease-in-out infinite; }
  @keyframes pulse-border{
    0%,100%{ box-shadow:0 0 0 2px var(--red); }
    50%{ box-shadow:0 0 0 5px var(--red-bg), 0 0 0 2px var(--red); }
  }
  .task-row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .status-badge{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:var(--r-pill); white-space:nowrap;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .status-badge.in-progress{ background:var(--green-bg); color:var(--green); }
  .status-badge.review{ background:var(--amber-bg); color:var(--amber); }
  .status-badge.blocked{ background:var(--red-bg); color:var(--red); }
  .owner-name{ font-size:16px; font-weight:600; }
  .task-label{ font-size:14px; color:var(--ink-soft); line-height:1.4; }
  .kit-tag{ font-size:12px; color:var(--teal); font-weight:600; margin-top:2px; }
  .task-row-meta{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-soft); }
  .timer{ font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  .stale-tag{ color:var(--red); font-weight:700; }
  .empty-hint{ font-size:14px; color:var(--ink-soft); padding:6px 0; }
  .help-btn{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; padding:0;
    background:var(--card); border:1px solid var(--border);
  }
  .help-btn.active{ background:var(--red); color:#fff; border-color:transparent; }
  .claim-btn{ width:100%; }

  .overlay{
    position:fixed; inset:0; background:var(--overlay-bg); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .hidden{ display:none !important; }
  .modal{
    position:relative;
    background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:28px;
    width:100%; max-width:440px; max-height:90vh; overflow-y:auto;
  }
  .modal h2{ font-size:21px; margin-bottom:6px; letter-spacing:-0.01em; }
  .modal p.sub{ font-size:14px; color:var(--ink-soft); margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  input[type=text], input[type=password], select, textarea{
    width:100%; font-family:inherit; font-size:16px; background:var(--paper); border:1px solid var(--border);
    padding:11px 14px; color:var(--ink); border-radius:var(--r-sm);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 4px var(--teal-bg); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions button{ flex:1; }
  .error-msg{ color:var(--red); font-size:13px; margin-top:8px; min-height:16px; }
  .close-x{ position:absolute; top:16px; right:16px; background:transparent; border:none; font-size:20px; color:var(--ink-soft); padding:4px 8px; }

  .updates-log{ border:1px solid var(--border); border-radius:var(--r-sm); max-height:160px; overflow-y:auto; margin-bottom:14px; }
  .updates-log .entry{ padding:9px 12px; border-bottom:1px solid var(--border); font-size:13px; }
  .updates-log .entry:last-child{ border-bottom:none; }
  .updates-log .entry .meta{ color:var(--ink-soft); font-size:11px; margin-top:2px; }
  .updates-log .empty{ padding:14px; text-align:center; color:var(--ink-soft); font-size:13px; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:16px; }

  table.history-table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-sm); }
  table.history-table th, table.history-table td{ text-align:left; padding:12px 14px; border-bottom:1px solid var(--border); font-size:14px; }
  table.history-table th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--gray-bg); }
  table.history-table tr:last-child td{ border-bottom:none; }
  table.history-table tr{ cursor:pointer; }
  .table-wrap{ overflow-x:auto; border-radius:var(--r-lg); }
  hr.divider{ margin:20px 0; border:none; border-top:1px solid var(--border); }
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand-eyebrow">LAB STATUS BOARD</div>
    <div class="brand-title">Live Task Tracker</div>
  </div>
  <div class="header-actions">
    <span class="clock mono" id="clock"></span>
    <a class="btn ghost small" href="/display.html" target="_blank" rel="noopener">Display Mode</a>
    <a class="btn ghost small" href="/admin.html">Lab Admin</a>
  </div>
</header>

<main>
  <div class="tabbar">
    <div class="tab active" data-tab="board">Board</div>
    <div class="tab" data-tab="history">History</div>
  </div>

  <div id="boardView">
    <div class="chipbar" id="zoneChips"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="historyView" class="hidden">
    <div class="table-wrap">
      <table class="history-table" id="historyTable">
        <thead>
          <tr><th>Completed</th><th>Station</th><th>Person</th><th>Task</th><th>Kit</th><th>Task time</th><th>Review time</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Claim modal -->
<div class="overlay hidden" id="claimOverlay">
  <div class="modal">
    <button class="close-x" data-close="claimOverlay">&times;</button>
    <h2 id="claimTitle">New task</h2>
    <div class="field">
      <label>Your name</label>
      <input type="text" id="ownerNameInput">
    </div>
    <div class="field">
      <label>Task</label>
      <textarea id="taskLabelInput" rows="2" placeholder="What are you working on?"></textarea>
    </div>
    <div class="field">
      <label>Kit</label>
      <input type="text" id="kitInput" placeholder="Which kit are you using?">
    </div>
    <div class="error-msg" id="claimError"></div>
    <div class="modal-actions">
      <button class="ghost" data-close="claimOverlay">Cancel</button>
      <button class="primary" id="claimSubmit">Start task</button>
    </div>
  </div>
</div>

<!-- History detail modal -->
<div class="overlay hidden" id="historyDetailOverlay">
  <div class="modal">
    <button class="close-x" data-close="historyDetailOverlay">&times;</button>
    <h2 id="historyDetailTitle">Task</h2>
    <p class="sub" id="historyDetailSub"></p>
    <div class="updates-log" id="historyDetailLog"></div>
    <div class="modal-actions">
      <a class="btn primary" id="historyDetailDownload" href="#" style="text-align:center; text-decoration:none; display:block;">Download report</a>
    </div>
  </div>
</div>

<script>
const API = '/.netlify/functions/stations';
const ZONE_LABELS = { offload: 'Offload', config: 'Config', 'script-testing': 'Script Testing', desk: 'Desk', unassigned: 'Unassigned' };
let state = { stations: [], tasks: [], zones: [] };
let history = [];
let activeZone = 'all';
let activeTab = 'board';
let claimingStationId = null;

function zoneLabel(z) { return ZONE_LABELS[z] || z; }

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => hide(btn.dataset.close));
});
// Clicking the dimmed backdrop (outside the modal itself) also closes it.
document.querySelectorAll('.overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.add('hidden');
  });
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.overlay:not(.hidden)').forEach(o => o.classList.add('hidden'));
});

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDuration(ms) {
  if (ms == null) return '--:--';
  const totalSec = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function fmtAgo(iso) {
  if (!iso) return '';
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins + 'm ago';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h + 'h ' + m + 'm ago';
}

async function api(action, extra) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ action, ...extra }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'request failed');
  return data;
}

async function refreshBoard() {
  try {
    const res = await fetch(API + '?t=' + Date.now());
    const data = await res.json();
    state.stations = data.stations;
    state.tasks = data.tasks;
    state.zones = data.zones;
    render();
  } catch (e) { console.error('refresh failed', e); }
}

async function refreshHistory() {
  try {
    const res = await fetch(API + '?history=1&t=' + Date.now());
    const data = await res.json();
    history = data.history;
    renderHistory();
  } catch (e) { console.error('history refresh failed', e); }
}

// --- Tabs ---
document.querySelectorAll('.tab').forEach(el => {
  el.addEventListener('click', () => {
    activeTab = el.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    document.getElementById('boardView').classList.toggle('hidden', activeTab !== 'board');
    document.getElementById('historyView').classList.toggle('hidden', activeTab !== 'history');
    if (activeTab === 'history') refreshHistory();
  });
});

// --- Board render ---
function renderZoneChips() {
  const bar = document.getElementById('zoneChips');
  const zones = ['all', ...state.zones];
  bar.innerHTML = zones.map(z =>
    `<div class="chip ${z === activeZone ? 'active' : ''}" data-zone="${z}">${z === 'all' ? 'All Zones' : zoneLabel(z)}</div>`
  ).join('');
  bar.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => { activeZone = el.dataset.zone; render(); });
  });
}

function render() {
  renderZoneChips();
  const grid = document.getElementById('grid');
  const visible = state.stations.filter(s => activeZone === 'all' || s.zone === activeZone);
  if (!visible.length) {
    grid.innerHTML = '<div class="empty-state">No stations in this zone.</div>';
    return;
  }
  grid.innerHTML = visible.map(stationHtml).join('');
  grid.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', () => openTask(el.dataset.open));
  });
  grid.querySelectorAll('[data-claim]').forEach(el => {
    el.addEventListener('click', () => openClaim(el.dataset.claim));
  });
  grid.querySelectorAll('.help-btn').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); toggleHelp(el.dataset.id); });
  });
}

function stationHtml(s) {
  const tasks = state.tasks.filter(t => t.stationId === s.id);
  const taskList = tasks.length
    ? `<div class="task-list">${tasks.map(taskRowHtml).join('')}</div>`
    : '<div class="empty-hint">No one working here right now.</div>';
  return `
  <div class="station">
    <div class="station-top">
      <div>
        <div class="station-name">${esc(s.name)}</div>
        <div class="zone-tag">${zoneLabel(s.zone)}</div>
      </div>
      <div class="station-count">${tasks.length} active</div>
    </div>
    ${taskList}
    <button class="ghost claim-btn" data-claim="${s.id}">+ New task at this station</button>
  </div>`;
}

function taskRowHtml(t) {
  const timerMs = t.status === 'review' ? t.reviewElapsedMs : t.taskElapsedMs;
  const timerLabel = t.status === 'review' ? 'Review' : 'Task';
  const classes = ['task-row', 'status-' + t.status, t.helpFlag ? 'help-flag' : ''].join(' ');
  return `
  <div class="${classes}" data-open="${t.id}">
    <div class="task-row-top">
      <div>
        <div class="owner-name">${esc(t.ownerName)}</div>
        <div class="task-label">${esc(t.taskLabel)}</div>
        ${t.kit ? `<div class="kit-tag">Kit: ${esc(t.kit)}</div>` : ''}
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <div class="status-badge ${t.status}">${t.status.replace('-', ' ')}</div>
        <button class="help-btn ${t.helpFlag ? 'active' : ''}" data-id="${t.id}" title="Flag for help">!</button>
      </div>
    </div>
    <div class="task-row-meta">
      <span>${timerLabel}: <span class="timer mono">${fmtDuration(timerMs)}</span></span>
      <span>${t.updates.length} update${t.updates.length === 1 ? '' : 's'} ${t.stale ? '<span class="stale-tag">STALE</span>' : ''}</span>
    </div>
  </div>`;
}

function toggleHelp(taskId) {
  api('toggleHelp', { taskId }).then(refreshBoard).catch(e => alert(e.message));
}

// --- Claim modal ---
function openClaim(stationId) {
  claimingStationId = stationId;
  const s = state.stations.find(s => s.id === stationId);
  document.getElementById('claimTitle').textContent = 'New task at ' + (s ? s.name : '');
  document.getElementById('ownerNameInput').value = '';
  document.getElementById('taskLabelInput').value = '';
  document.getElementById('kitInput').value = '';
  document.getElementById('claimError').textContent = '';
  show('claimOverlay');
  document.getElementById('ownerNameInput').focus();
}
document.getElementById('claimSubmit').addEventListener('click', async () => {
  const err = document.getElementById('claimError');
  err.textContent = '';
  try {
    const data = await api('claim', {
      stationId: claimingStationId,
      ownerName: document.getElementById('ownerNameInput').value,
      taskLabel: document.getElementById('taskLabelInput').value,
      kit: document.getElementById('kitInput').value,
    });
    // Drop the person straight into their new task's dedicated page (notes,
    // file upload, status controls) instead of back at the grid - they
    // came here to start working on it, not to look at the board again.
    if (data.created) openTask(data.created.id);
  } catch (e) { err.textContent = e.message; }
});

// Task detail lives on its own page now (task.html), one task at a time,
// instead of a popup modal here on the board.
function openTask(taskId) {
  location.href = '/task.html?id=' + encodeURIComponent(taskId);
}

function updateEntryHtml(u) {
  const att = u.attachment
    ? `<div><a href="/.netlify/functions/attachments?key=${encodeURIComponent(u.attachment.key)}" target="_blank" rel="noopener">📎 ${esc(u.attachment.filename)}</a></div>`
    : '';
  return `
    <div class="entry">
      <div>${esc(u.note)}</div>
      ${att}
      <div class="meta">${new Date(u.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} · ${u.status}</div>
    </div>`;
}

// --- History ---
function renderHistory() {
  const body = document.getElementById('historyBody');
  if (!history.length) {
    body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--ink-soft);">No completed tasks yet.</td></tr>';
    return;
  }
  body.innerHTML = history.map((h, i) => `
    <tr data-idx="${i}">
      <td>${fmtAgo(h.completedAt)}</td>
      <td>${esc(h.stationName)}</td>
      <td>${esc(h.ownerName)}</td>
      <td>${esc(h.taskLabel)}</td>
      <td>${esc(h.kit || '-')}</td>
      <td class="mono">${fmtDuration(h.taskDurationMs)}</td>
      <td class="mono">${fmtDuration(h.reviewDurationMs)}</td>
    </tr>`).join('');
  body.querySelectorAll('tr[data-idx]').forEach(row => {
    row.addEventListener('click', () => openHistoryDetail(history[Number(row.dataset.idx)]));
  });
}
function openHistoryDetail(h) {
  document.getElementById('historyDetailTitle').textContent = `${h.stationName} — ${h.taskLabel}`;
  document.getElementById('historyDetailSub').textContent =
    `${h.ownerName} · kit ${h.kit || 'n/a'} · task ${fmtDuration(h.taskDurationMs)} · review ${fmtDuration(h.reviewDurationMs)} · completed ${new Date(h.completedAt).toLocaleString()}`;
  document.getElementById('historyDetailLog').innerHTML = h.updates.length
    ? h.updates.map(updateEntryHtml).join('')
    : '<div class="empty">No update notes.</div>';
  document.getElementById('historyDetailDownload').href = '/.netlify/functions/report?id=' + encodeURIComponent(h.id);
  show('historyDetailOverlay');
}

function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
tickClock();
setInterval(tickClock, 30000);
setInterval(() => { if (activeTab === 'board') render(); }, 1000); // live timer tick
setInterval(refreshBoard, 1000);
refreshBoard();
</script>
</body>
