<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Status Board — Display</title>
<style>
  :root{
    --paper:#000000;
    --ink:#f5f5f7;
    --ink-soft:#9a9a9e;
    --green:#30d158;
    --green-bg: rgba(48,209,88,0.14);
    --amber:#ff9f0a;
    --amber-bg: rgba(255,159,10,0.14);
    --red:#ff453a;
    --red-bg: rgba(255,69,58,0.14);
    --gray-bg: rgba(255,255,255,0.06);
    --card:#161618;
    --border: rgba(255,255,255,0.1);
    --r-lg:22px; --r-pill:999px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--paper); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; padding:28px 32px; }
  .mono{ font-variant-numeric:tabular-nums; }
  header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; }
  .brand-eyebrow{ font-size:16px; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; text-transform:uppercase; }
  .brand-title{ font-size:40px; font-weight:800; letter-spacing:-0.02em; margin-top:2px; }
  .clock{ font-size:30px; font-weight:700; color:var(--ink-soft); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:20px; }
  .station{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:22px 24px; display:flex; flex-direction:column; gap:14px;
  }
  .station-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .station-name{ font-size:24px; font-weight:800; letter-spacing:-0.01em; }
  .zone-tag{ font-size:14px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }

  .task-row{ border-radius:16px; padding:14px 16px; background:var(--gray-bg); position:relative; }
  .task-row.status-in-progress{ box-shadow:0 0 0 3px var(--green); }
  .task-row.status-review{ box-shadow:0 0 0 3px var(--amber); }
  .task-row.status-blocked{ box-shadow:0 0 0 3px var(--red); }
  .task-row.help-flag{ animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 3px var(--red); }
    50%{ box-shadow:0 0 0 9px var(--red-bg), 0 0 0 3px var(--red); }
  }
  .task-row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .owner-name{ font-size:22px; font-weight:800; }
  .task-label{ font-size:16px; color:var(--ink-soft); margin-top:2px; }
  .kit-tag{ font-size:13px; color:var(--green); font-weight:700; margin-top:4px; }
  .status-badge{
    font-size:13px; font-weight:800; padding:5px 12px; border-radius:var(--r-pill); white-space:nowrap;
    text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;
  }
  .status-badge.in-progress{ background:var(--green-bg); color:var(--green); }
  .status-badge.review{ background:var(--amber-bg); color:var(--amber); }
  .status-badge.blocked{ background:var(--red-bg); color:var(--red); }
  .timer{ font-size:32px; font-weight:800; letter-spacing:-0.01em; margin-top:8px; }
  .timer-label{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .stale-tag{ color:var(--red); font-weight:800; font-size:13px; margin-left:10px; }
  .help-tag{ color:var(--red); font-weight:800; font-size:13px; }
  .empty-hint{ font-size:16px; color:var(--ink-soft); padding:6px 0; }
  .empty-state{ text-align:center; padding:100px 20px; color:var(--ink-soft); font-size:22px; }

  .task-row{ cursor:pointer; }
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; }
  .hidden{ display:none !important; }
  .modal{
    position:relative; background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:28px 30px; width:100%; max-width:560px; max-height:85vh; overflow-y:auto;
  }
  .modal .close-x{
    position:absolute; top:16px; right:16px; background:transparent; border:none; color:var(--ink-soft);
    font-size:26px; padding:4px 10px; cursor:pointer;
  }
  .modal-station{ font-size:14px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
  .modal-task{ font-size:24px; font-weight:800; margin:4px 0 2px; }
  .modal-owner{ font-size:16px; color:var(--ink-soft); }
  .modal-kit{ font-size:14px; color:var(--green); font-weight:700; margin-top:6px; }
  .modal-times{ display:flex; gap:24px; margin:16px 0; }
  .modal-times .timer-label{ font-size:11px; }
  .modal-times .timer{ font-size:24px; margin-top:2px; }
  .modal-log-title{ font-size:14px; font-weight:700; margin:18px 0 8px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .modal-log{ border:1px solid var(--border); border-radius:14px; max-height:280px; overflow-y:auto; }
  .modal-log .entry{ padding:12px 14px; border-bottom:1px solid var(--border); font-size:14px; }
  .modal-log .entry:last-child{ border-bottom:none; }
  .modal-log .entry .meta{ color:var(--ink-soft); font-size:11px; margin-top:4px; text-transform:uppercase; letter-spacing:.02em; font-weight:600; }
  .modal-log .entry a{ color:var(--green); }
  .modal-log .empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand-eyebrow">Lab Status Board</div>
    <div class="brand-title">Live Display</div>
  </div>
  <div class="clock mono" id="clock"></div>
</header>

<div class="grid" id="grid"></div>

<div class="overlay hidden" id="taskDetailOverlay">
  <div class="modal">
    <button class="close-x" id="closeDetailBtn">&times;</button>
    <div id="taskDetailBody"></div>
  </div>
</div>

<script>
const API = '/.netlify/functions/stations';
const ZONE_LABELS = { offload: 'Offload', config: 'Config', 'script-testing': 'Script Testing', desk: 'Desk', unassigned: 'Unassigned' };
let state = { stations: [], tasks: [] };

function zoneLabel(z) { return ZONE_LABELS[z] || z; }
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDuration(ms) {
  if (ms == null) return '--:--';
  const totalSec = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

async function refresh() {
  try {
    const res = await fetch(API + '?t=' + Date.now());
    const data = await res.json();
    state.stations = data.stations;
    state.tasks = data.tasks;
    render();
  } catch (e) { console.error('refresh failed', e); }
}

let openTaskId = null;

function render() {
  const grid = document.getElementById('grid');
  if (!state.stations.length) {
    grid.innerHTML = '<div class="empty-state">No stations configured.</div>';
    return;
  }
  grid.innerHTML = state.stations.map(stationHtml).join('');
  grid.querySelectorAll('[data-task-id]').forEach(el => {
    el.addEventListener('click', () => openTaskDetail(el.dataset.taskId));
  });
  if (openTaskId) renderTaskDetail(); // keep the open modal's live timer/log in sync with each refresh
}

function stationHtml(s) {
  const tasks = state.tasks.filter(t => t.stationId === s.id);
  const taskList = tasks.length ? tasks.map(taskRowHtml).join('') : '<div class="empty-hint">Not in use</div>';
  return `
  <div class="station">
    <div class="station-top">
      <div class="station-name">${esc(s.name)}</div>
      <div class="zone-tag">${zoneLabel(s.zone)}</div>
    </div>
    ${taskList}
  </div>`;
}

function taskRowHtml(t) {
  const timerMs = t.status === 'review' ? t.reviewElapsedMs : t.taskElapsedMs;
  const timerLabel = t.status === 'review' ? 'Review time' : 'Task time';
  const classes = ['task-row', 'status-' + t.status, t.helpFlag ? 'help-flag' : ''].join(' ');
  return `
  <div class="${classes}" data-task-id="${t.id}">
    <div class="task-row-top">
      <div>
        <div class="owner-name">${esc(t.ownerName)}</div>
        <div class="task-label">${esc(t.taskLabel)}</div>
        ${t.kit ? `<div class="kit-tag">Kit: ${esc(t.kit)}</div>` : ''}
      </div>
      <div class="status-badge ${t.status}">${t.status.replace('-', ' ')}</div>
    </div>
    <div class="timer-label">${timerLabel}${t.stale ? '<span class="stale-tag">STALE</span>' : ''}${t.helpFlag ? '<span class="help-tag"> · NEEDS HELP</span>' : ''}</div>
    <div class="timer mono">${fmtDuration(timerMs)}</div>
  </div>`;
}

// --- Read-only task quick-view modal ---
function updateEntryHtml(u) {
  const att = u.attachment
    ? `<div><a href="/.netlify/functions/attachments?key=${encodeURIComponent(u.attachment.key)}" target="_blank" rel="noopener">📎 ${esc(u.attachment.filename)}</a></div>`
    : '';
  return `
    <div class="entry">
      <div>${esc(u.note)}</div>
      ${att}
      <div class="meta">${new Date(u.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} · ${esc(u.status)}</div>
    </div>`;
}

function openTaskDetail(taskId) {
  openTaskId = taskId;
  renderTaskDetail();
  document.getElementById('taskDetailOverlay').classList.remove('hidden');
}

function closeTaskDetail() {
  openTaskId = null;
  document.getElementById('taskDetailOverlay').classList.add('hidden');
}

function renderTaskDetail() {
  const t = state.tasks.find(t => t.id === openTaskId);
  const body = document.getElementById('taskDetailBody');
  if (!t) {
    // The task was completed/released/approved while this was open.
    body.innerHTML = '<div class="empty-state" style="padding:20px;">This task is no longer active.</div>';
    return;
  }
  const s = state.stations.find(s => s.id === t.stationId);
  const timerMs = t.status === 'review' ? t.reviewElapsedMs : t.taskElapsedMs;
  const timerLabel = t.status === 'review' ? 'Review time' : 'Task time';
  body.innerHTML = `
    <div class="modal-station">${esc(s ? s.name : t.stationId)}</div>
    <div class="modal-task">${esc(t.taskLabel)}</div>
    <div class="modal-owner">${esc(t.ownerName)}</div>
    ${t.kit ? `<div class="modal-kit">Kit: ${esc(t.kit)}</div>` : ''}
    <div class="modal-times">
      <div>
        <div class="timer-label">${timerLabel}</div>
        <div class="timer mono">${fmtDuration(timerMs)}</div>
      </div>
      <div>
        <div class="timer-label">Status</div>
        <div class="status-badge ${t.status}" style="margin-top:4px;">${t.status.replace('-', ' ')}</div>
      </div>
    </div>
    <div class="modal-log-title">Notes &amp; files</div>
    <div class="modal-log">
      ${t.updates.length ? t.updates.slice().reverse().map(updateEntryHtml).join('') : '<div class="empty">No updates yet.</div>'}
    </div>`;
}

document.getElementById('closeDetailBtn').addEventListener('click', closeTaskDetail);
document.getElementById('taskDetailOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeTaskDetail();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTaskDetail(); });

function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
tickClock();
setInterval(tickClock, 1000);
setInterval(render, 1000); // live timer tick
setInterval(refresh, 1000); // pull the latest claim/status/note state every 1s so the wall display is effectively real-time
refresh();
</script>
</body>
</html>
